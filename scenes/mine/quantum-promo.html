<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quantum mechanics: the observer (20 s trailer)</title>
<script src="../../brand.js"></script>
<script src="../../kit/motion.js"></script>
<script src="../../kit/blocks.js"></script>
<script src="../../kit/fx.js"></script>
</head>
<body>
<script>
// 20 s epic film-trailer promo for the quantum video. Letterboxed 2.39:1, teal and gold grade, slow pushes,
// title cards between the narration, drums that build to a hard silence, then the title on the final hit.
// Narration lines are cut from the main video's one take; the score is synthesized by tools/trailer-score.py.
const W = 1920, H = 1080;
const F = B.brand.fonts;
const GOLD = '#F2C46B', TEAL = '#7FD6E6';
const S = '../../assets/broll/stock/';
const VO = '../../assets/vo/quantum-promo/';
const BAR = 138;                 // 2.39:1 letterbox
const GAP0 = 17.35, GAP1 = 17.8, END = 20;

// Shots. `say`: narration (CAPS pop), `card`: trailer title over the shot.
const SHOTS = [
  { at: 0, media: 'openverse-6555477b.jpg', z: [1.35, 1.12], fx: 0.35, fy: 0.35, vo: 'l1.mp3', voAt: 0.5, say: 'Down at the SMALLEST scale, things don’t have ONE place.', speech: [0.5, 3.86], credit: 'Atom model, US DOE, CC0' },
  { at: 4.3, media: 'openverse-041ba444.jpg', z: [1.0, 1.14], fx: 0.55, fy: 0.6, card: ['1927', 'THE GREATEST MINDS ALIVE'], credit: 'Solvay Conference 1927, B. Couprie, public domain' },
  { at: 6.6, media: 'vid-buildup.mov', from: 30, speed: 7, card: ['', 'COULD NOT AGREE ON WHAT IT MEANT'], credit: 'Bach et al. 2013, CC BY 3.0' },
  { at: 8.0, media: 'vid-particle.webm', from: 0.5, vo: 'l6.mp3', voAt: 8.0, say: 'Now WATCH which slit each one takes, and the stripes DISAPPEAR.', speech: [8.12, 11.8], credit: 'S. Kelley / The Quantum Atlas, CC BY-SA 4.0' },
  { at: 12.0, media: 'openverse-7ed5b0db.jpg', z: [1.28, 1.06], vo: 'l7.mp3', voAt: 12.05, say: 'LOOKING changes the RESULT.', speech: [12.14, 13.6], credit: 'CMS detector, CERN, µµ, CC BY-SA 2.0' },
  { at: 13.9, media: 'vid-qds.webm', from: 1.5, flash: true, credit: 'S. Kelley / The Quantum Atlas, CC BY-SA 4.0' },
  { at: 14.2, media: 'vid-wave.webm', from: 1.0, flash: true, credit: 'S. Kelley / The Quantum Atlas, CC BY-SA 4.0' },
  { at: 14.5, media: 'vid-buildup.mov', from: 55, speed: 3, flash: true, credit: 'Bach et al. 2013, CC BY 3.0' },
  { at: 14.8, media: 'vid-tube.webm', from: 0.2, speed: 0.6, vo: 'l12.mp3', voAt: 14.8, say: 'You ARE the universe, looking at ITSELF.', speech: [14.93, 17.2], credit: 'BalticLabor, CC BY 4.0' },
];
SHOTS.forEach((s, i) => { s.end = SHOTS[i + 1] ? SHOTS[i + 1].at : GAP0; });
const isVideo = (s) => /\.(webm|mov|mp4)$/.test(s.media);
SHOTS.forEach((s) => {
  if (isVideo(s)) s.vid = M.video(S + s.media, { at: s.at, trim: s.from || 0, speed: s.speed || 1, audio: false });
  else s.img = M.image(S + s.media);
});
const ASPECT = { 'vid-qds.webm': 854 / 470, 'vid-wave.webm': 854 / 470, 'vid-particle.webm': 854 / 470, 'vid-buildup.mov': 640 / 288 };
M.fonts(['800 90px "Barlow Condensed"', '600 90px "Barlow Condensed"', '800 90px "Plus Jakarta Sans"', '500 20px "JetBrains Mono"']);
const COND = '"Barlow Condensed"';

function shot(c, t, s) {
  const p = M.clamp((t - s.at) / (s.end - s.at + 0.5));
  if (!isVideo(s)) {
    M.cover(c, s.img, 0, 0, W, H, { dim: 0.25, fx: s.fx ?? 0.5, fy: s.fy ?? 0.5, zoom: M.lerp(s.z[0], s.z[1], M.ease.inOutCubic(p)) });
    return;
  }
  const a = ASPECT[s.media];
  if (!a) { s.vid.draw(c, t, 0, 0, W, H, { zoom: 1.04 + 0.08 * p }); return; }
  // Low-res science footage: blurred copy fills the frame, the sharp copy floats in a frameless card.
  c.save(); c.filter = 'blur(34px) brightness(0.7)'; s.vid.draw(c, t, -80, -80, W + 160, H + 160, { zoom: 1.15 }); c.restore();
  const ch = Math.min(640, 1560 / a), cw = ch * a, cx = (W - cw) / 2, cy = (H - ch) / 2 - 30;
  const k = 1.0 + 0.06 * p;
  c.save(); c.translate(W / 2, H / 2); c.scale(k, k); c.translate(-W / 2, -H / 2);
  c.shadowColor = 'rgba(0,0,0,0.7)'; c.shadowBlur = 80; c.fillStyle = '#000'; c.fillRect(cx, cy, cw, ch); c.shadowBlur = 0;
  s.vid.draw(c, t, cx, cy, cw, ch, { zoom: 1.1 });
  c.restore();
}

// Teal shadows, warm highlights: a blockbuster grade drawn over the frame.
function grade(c) {
  c.save();
  c.globalCompositeOperation = 'soft-light';
  const g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, 'rgba(20,90,110,0.55)'); g.addColorStop(1, 'rgba(255,170,80,0.35)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.restore();
}

function card(c, t, s) {
  const d = t - s.at - 0.15, len = s.end - s.at;
  const a = M.clamp(d / 0.45) * M.clamp((len - 0.1 - d) / 0.3);
  if (a <= 0) return;
  c.save();
  c.fillStyle = `rgba(0,0,0,${0.35 * a})`; c.fillRect(0, 0, W, H);
  const k = 1 + 0.04 * M.clamp(d / len);
  c.translate(W / 2, H / 2); c.scale(k, k);
  c.textAlign = 'center'; c.globalAlpha = a;
  c.shadowColor = 'rgba(242,196,107,0.45)'; c.shadowBlur = 30;
  let y = 28;
  if (s.card[0]) {
    c.font = `600 54px ${COND}`; c.letterSpacing = '22px'; c.fillStyle = GOLD;
    c.fillText(s.card[0], 11, -70);
  } else y = 0;
  const ls = 14 + 6 * M.clamp(d / len);
  let size = 112; c.letterSpacing = `${ls}px`;
  for (; size > 60; size -= 4) { c.font = `800 ${size}px ${COND}`; if (c.measureText(s.card[1]).width < 1500) break; }
  c.fillStyle = '#F4EEE2';
  c.fillText(s.card[1], ls / 2, y + 40);
  c.restore();
}

function caption(c, t, s) {
  const [vs, ve] = s.speech;
  if (t < vs - 0.1 || t > ve + 0.6) return;
  const words = s.say.split(' ');
  const per = (ve - vs) / words.reduce((sum, w) => sum + 0.18 + w.length * 0.045, 0);
  let acc = vs;
  const base = 54, big = 84;
  const isKey = (w) => { const x = w.replace(/[^A-Za-z]/g, ''); return x.length > 1 && x === x.toUpperCase(); };
  const parts = words.map((w) => {
    const key = isKey(w);
    c.font = `800 ${key ? big : base}px ${F.display}`;
    const o = { text: w, key, w: c.measureText(w + ' ').width, at: acc };
    acc += (0.18 + w.length * 0.045) * per;
    return o;
  });
  const lines = [[]]; let lw = 0;
  for (const p of parts) { if (lw + p.w > 1500 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(p); lw += p.w; }
  const lineH = 96, y0 = H - BAR - 60 - (lines.length - 1) * lineH;
  const fade = M.clamp((ve + 0.6 - t) / 0.3);
  lines.forEach((line, li) => {
    const total = line.reduce((sum, p) => sum + p.w, 0);
    let x = (W - total) / 2;
    for (const p of line) {
      const d = t - p.at + 0.08;
      if (d >= 0) {
        const e = M.clamp(d / 0.22);
        const pop = p.key ? 1 + 0.28 * Math.exp(-d * 7) * Math.sin(Math.min(Math.PI, d * 14)) : 1;
        c.save();
        c.font = `800 ${p.key ? big : base}px ${F.display}`;
        const cx = x + p.w / 2, cy = y0 + li * lineH;
        c.translate(cx, cy); c.scale(pop, pop); c.translate(-cx, -cy);
        c.globalAlpha = e * fade;
        c.lineJoin = 'round'; c.lineWidth = p.key ? 12 : 9; c.strokeStyle = 'rgba(0,0,0,0.85)';
        c.strokeText(p.text, x, cy + (1 - e) * 14);
        if (p.key) { c.shadowColor = 'rgba(242,196,107,0.6)'; c.shadowBlur = 24; }
        c.fillStyle = p.key ? GOLD : '#FFFFFF';
        c.fillText(p.text, x, cy + (1 - e) * 14);
        c.restore();
      }
      x += p.w;
    }
  });
}

function credit(c, t, s) {
  c.save();
  c.font = `500 17px ${F.mono}`; c.textAlign = 'right';
  c.globalAlpha = 0.55 * M.clamp((t - s.at - 0.1) / 0.3);
  c.fillStyle = '#C9D2DA'; c.fillText(s.credit, W - 60, BAR - 22);
  c.restore();
}

function title(c, t) {
  const d = t - GAP1;
  if (d < 0) return;
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  // A slow light bloom behind the title on the hit.
  const bloom = Math.exp(-d * 1.4);
  const g = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900);
  g.addColorStop(0, `rgba(242,196,107,${0.35 * bloom + 0.08})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.textAlign = 'center';
  const k = 1.12 - 0.12 * M.ease.outCubic(M.clamp(d / 2.2));
  c.translate(W / 2, H / 2 - 20); c.scale(k, k);
  c.globalAlpha = M.clamp(d / 0.12);
  c.shadowColor = 'rgba(242,196,107,0.55)'; c.shadowBlur = 40 * bloom + 10;
  c.font = `800 210px ${COND}`; c.letterSpacing = `${30 - 12 * M.clamp(d / 2.2)}px`; c.fillStyle = '#F7F1E6';
  c.fillText('THE OBSERVER', 15, 60);
  c.restore();
  c.save(); c.textAlign = 'center';
  const a2 = M.clamp((d - 0.6) / 0.5);
  c.globalAlpha = a2; c.font = `600 44px ${COND}`; c.letterSpacing = '16px'; c.fillStyle = GOLD;
  c.fillText('QUANTUM MECHANICS', W / 2 + 8, H / 2 + 130);
  const a3 = M.clamp((d - 1.1) / 0.5);
  c.globalAlpha = a3; c.font = `600 32px ${COND}`; c.letterSpacing = '10px'; c.fillStyle = '#E8E2D6';
  c.fillText('WATCH THE FULL VIDEO', W / 2 + 5, H / 2 + 200);
  c.restore();
}

// Quick white flashes on the drum hits of the fast cuts.
const FLASHES = [4.3, 6.6, 8.0, 12.0, 13.9, 14.2, 14.5, 14.8];

M.setup({
  preset: 'youtube', duration: END, cuts: SHOTS.slice(1).map((s) => s.at).concat([GAP0, GAP1]), background: '#000', look: 'film',
  motionBlur: { samples: 4, around: true },
  voice: SHOTS.filter((s) => s.vo).map((s) => ({ at: s.voAt, file: VO + s.vo, text: s.say.replace(/\b[A-Z]{2,}\b/g, (w) => w.toLowerCase()) })),
  music: { track: 'assets/vo/quantum-promo/trailer.wav', volume: 0.55 },
  sfx: [
    { at: 0, name: 'boom', volume: 0.5 },
    { at: 11.25, name: 'glitch', volume: 0.3 },
    { at: 12.0, name: 'hit', volume: 0.35 },
    { at: GAP1, name: 'boom', volume: 0.7 },
  ],
  cover: GAP1 + 1.4,
  post: { caption: 'In 1927 the greatest minds alive could not agree on what one experiment meant. Watch which slit an electron takes and the pattern disappears. The full video is up now.', hashtags: ['quantummechanics', 'physics', 'doubleslit', 'science', 'trailer'] },
  draw: (ctx, t) => {
    if (t >= GAP1) { title(ctx, t); }
    else if (t >= GAP0) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
    else {
      const s = [...SHOTS].reverse().find((x) => t >= x.at) || SHOTS[0];
      const open = M.clamp(t / 0.7);
      const end = FX.camera(ctx, t, { punch: SHOTS.filter((x) => x.flash).map((x) => x.at), punchAmount: 0.04, shake: t > 13.9 && t < 14.8 ? 0.4 : 0 });
      shot(ctx, t, s);
      end();
      grade(ctx);
      FX.vignette(ctx, { strength: 0.65 });
      if (s.card) card(ctx, t, s);
      if (s.say) caption(ctx, t, s);
      // open from black, and white flashes on the hits
      if (open < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - M.ease.outCubic(open)})`; ctx.fillRect(0, 0, W, H); }
      for (const f of FLASHES) { const d = t - f; if (d >= 0 && d < 0.18) { ctx.fillStyle = `rgba(255,244,225,${0.55 * (1 - d / 0.18)})`; ctx.fillRect(0, 0, W, H); } }
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, BAR); ctx.fillRect(0, H - BAR, W, BAR);
      credit(ctx, t, s);
    }
  },
});
</script>
</body>
</html>
