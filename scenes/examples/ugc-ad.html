<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>UGC ad template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600&display=block">
<script src="../../brand.js"></script>
<script src="../../kit/motion.js"></script>
<script src="../../kit/blocks.js"></script>
</head>
<body>
<script>
// UGC ad template: a talking-head clip (e.g. a Higgsfield AI creator) with TikTok-native overlays.
//
//   0.0  comment-reply sticker + hook text (3 hook variants to A/B test)
//   0-6  talking head, word-by-word captions from the clip's own speech
//   6-9  B-roll / product clip, product card slides up
//   9-12 back to the creator, review card
//   12-15 end card with CTA
//
// Put your clips at the paths below (or change them). Until they exist, the template renders with
// placeholders so you can check timing and layout first. Make it with:
//   node make.mjs scenes/examples/ugc-ad.html              # one video
//   node make.mjs scenes/examples/ugc-ad.html --variants   # one per hook
const C = B.brand.colors;

const HOOK = M.pick([
  'I was today years old when I found this',
  'Stop scrolling if your skin hates winter',
  'POV: you finally found a serum that works',
]);

M.setup({
  width: 1080, height: 1920, fps: 30, duration: 15, background: '#000', cuts: [6, 9, 12],
  captions: true,                                   // word-by-word captions from the creator's speech
  music: { track: 'pulse', volume: 0.12 },          // quiet: it ducks further under the voice
  sfx: [
    { at: 0.0, name: 'pop', volume: 0.5 }, { at: 6.0, name: 'whoosh', volume: 0.4 }, { at: 6.4, name: 'coin', volume: 0.45 },
    { at: 9.0, name: 'whoosh', volume: 0.4 }, { at: 12.0, name: 'chime', volume: 0.5 }, { at: 13.6, name: 'tap', volume: 0.6 },
  ],
  draw,
});

// The clips. at = when each starts in the ad; trim = seconds skipped at the start of the file.
// transcript: used for estimated captions only when there's no ELEVENLABS_API_KEY to transcribe.
const creator = M.video('../../assets/higgsfield/talking-head.mp4', {
  at: 0, captions: true,
  transcript: 'Okay so my skin was so dry this winter. I tried everything. Then I found this. Two weeks in, honestly, it is a different face.',
});
const broll = M.video('../../assets/higgsfield/product-broll.mp4', { at: 6, audio: false });

function draw(ctx, t) {
  // Picture: creator, cut to B-roll for 6-9 s, back to the creator. Slow push-in on each shot.
  if (t >= 6 && t < 9) broll.draw(ctx, t, 0, 0, 1080, 1920, { zoom: 1 + 0.04 * M.clamp((t - 6) / 3) });
  else creator.draw(ctx, t, 0, 0, 1080, 1920, { zoom: 1.02 + 0.03 * Math.sin(t * 0.3) });

  // Hook: the comment it "replies" to, then the hook text. Both on screen at frame 0.
  B.commentReply(ctx, t, { at: 0, until: 5.6, user: 'mel.daily', text: 'what do you actually use for dry skin??', y: 250 });
  B.nativeText(ctx, t, { at: 0.6, until: 5.6, text: HOOK, y: 520 });

  // Product moment.
  B.productCard(ctx, t, { at: 6.3, until: 11.8, name: 'Glow Serum 30ml', price: '$29', oldPrice: '$39',
    rating: 4.8, reviews: '2.1k', badge: '-25%', y: 880 });

  // Social proof (written as an example: swap in a real review you have permission to use).
  B.review(ctx, t, { at: 9.2, until: 11.8, name: 'Example review', rating: 5, text: 'Two weeks in and my skin finally feels normal.', y: 300 });

  // End card.
  B.endCard(ctx, t, { at: 12, takeaway: 'Winter-proof skin.', cta: 'Shop now' });
  B.tap(ctx, t, { at: 13.6, x: 640, y: 1200 });
}
</script>
</body>
</html>
