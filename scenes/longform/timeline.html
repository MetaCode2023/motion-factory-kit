<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Timeline: dated events</title>
<script src="../../brand.js"></script>
<script src="../../kit/motion.js"></script>
<script src="../../kit/fx.js"></script>
<script src="lf.js"></script>
</head>
<body>
<script>
// 16:9 template. Dated events sliding past on a line, the camera tracking to the latest. History in 6 s.
// Data: dur, kicker, headline, accent, events: "1913=The Fed is created; 1971=Dollar leaves gold; 2008=Bailouts" (or [{date,text}])
const D = M.data({ dur: 7, kicker: 'HOW WE GOT HERE', headline: 'A short history', accent: '',
  events: 'Year 1=First thing happens; Year 2=Second thing; Year 3=Third thing; Year 4=Where we are now' });
const th = LF.theme(D);
const E = Array.isArray(D.events) ? D.events : String(D.events).split(';').filter((p) => p.trim()).map((p) => { const i = p.indexOf('='); return { date: p.slice(0, i).trim(), text: p.slice(i + 1).trim() }; });
const n = E.length, STEP = 520, Y = 640;
const AT = E.map((_, i) => 0.6 + i * Math.max(0.7, (D.dur - 1.8) / n));
M.setup({ preset: 'youtube', duration: D.dur, background: '#05060A', draw, look: 'cinematic', sfx: AT.map((at, i) => ({ at, name: i === n - 1 ? 'hit' : 'tick', volume: i === n - 1 ? 0.5 : 0.55 })) });
function draw(c, t) {
  LF.backdrop(c, t, th);
  // camera: the current event sits at x = 1200
  let cur = 0; AT.forEach((a, i) => { if (t >= a - 0.35) cur = i; });
  const prev = Math.max(0, cur - 1), mv = M.ease.inOutCubic(M.clamp((t - (AT[cur] - 0.35)) / 0.5));
  const focus = (prev + (cur - prev) * mv) * STEP;
  const ox = 1200 - focus - 300;
  c.strokeStyle = 'rgba(255,255,255,0.12)'; c.lineWidth = 4; c.beginPath(); c.moveTo(0, Y); c.lineTo(1920, Y); c.stroke();
  FX.glow(c, () => { c.strokeStyle = th.color; c.lineWidth = 4; c.beginPath(); c.moveTo(0, Y); c.lineTo(Math.max(0, ox + 300 + focus), Y); c.stroke(); }, { color: th.color, blur: 18, strength: 0.6 });
  E.forEach((e, i) => {
    const x = ox + 300 + i * STEP;
    if (x < -300 || x > 2300) return;
    const on = t >= AT[i], k = M.ease.outBack(M.clamp((t - AT[i]) / 0.45));
    c.beginPath(); c.arc(x, Y, on ? 16 : 10, 0, Math.PI * 2); c.fillStyle = on ? th.color : 'rgba(255,255,255,0.3)'; c.fill();
    if (k <= 0) return;
    const latest = i === cur, up = i % 2 === 0;
    c.save(); c.globalAlpha = Math.min(1, k) * (latest ? 1 : 0.55);
    M.text(c, e.date, x, up ? Y - 170 : Y + 110, { font: `800 ${latest ? 72 : 56}px ${LF.F.display}`, color: latest ? th.color : th.ink, align: 'center' });
    LF.para(c, e.text, x, up ? Y - 150 : Y + 130, { font: `600 32px ${LF.F.display}`, color: th.ink, width: 440, align: 'center' });
    c.restore();
  });
  // title on top of the moving scene
  c.save(); const g = c.createLinearGradient(0, 0, 0, 300); g.addColorStop(0, 'rgba(5,6,10,0.85)'); g.addColorStop(1, 'rgba(5,6,10,0)'); c.fillStyle = g; c.fillRect(0, 0, 1920, 300); c.restore();
  LF.title(c, t, D, th);
  FX.vignette(c, { strength: 0.5 });
}
</script>
</body>
</html>
