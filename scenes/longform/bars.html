<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bars: compare amounts</title>
<script src="../../brand.js"></script>
<script src="../../kit/motion.js"></script>
<script src="../../kit/fx.js"></script>
<script src="lf.js"></script>
</head>
<body>
<script>
// 16:9 template. A few amounts as horizontal bars that grow, biggest lit up. Only real figures; put the
// source in "source".
// Data: dur, kicker, headline, accent, unit ("%", "$B", ...), bars: [{ label, value }], highlight (label), source
const D = M.data({ dur: 6, kicker: 'BY THE NUMBERS', headline: 'Where the money goes', accent: '', unit: '%',
  bars: [{ label: 'Example A', value: 42 }, { label: 'Example B', value: 27 }, { label: 'Example C', value: 18 }, { label: 'Example D', value: 13 }], highlight: '', source: 'Example figures' });
const th = LF.theme(D);
const max = Math.max(...D.bars.map((b) => b.value));
const AT = LF.schedule(D, D.bars.map((b) => b.label), { start: 0.7 });
M.setup({ preset: 'youtube', duration: D.dur, background: '#05060A', draw, look: 'cinematic',
  sfx: [...AT.map((at) => ({ at, name: 'tick', volume: 0.45 })), { at: AT[AT.length - 1] + 0.9, name: 'chime', volume: 0.55 }] });
const top = D.highlight || D.bars.reduce((a, b) => (b.value > a.value ? b : a)).label;
function draw(c, t) {
  LF.backdrop(c, t, th);
  const endCam = LF.drift(c, t, D, { zoom: 0.035 });
  LF.title(c, t, D, th);
  const x = 520, w = 1150, y0 = 340, row = Math.min(130, 560 / D.bars.length);
  D.bars.forEach((b, i) => {
    const k = M.ease.outCubic(M.clamp((t - AT[i]) / 0.9)), hot = b.label === top, y = y0 + i * row;
    M.text(c, b.label, x - 40, y + row * 0.45, { font: `700 40px ${LF.F.display}`, color: hot ? th.ink : th.muted, align: 'right', alpha: M.prog(t, AT[i] - 0.2, 0.3) });
    M.roundRect(c, x, y + row * 0.18, w, row * 0.42, row * 0.21); c.fillStyle = 'rgba(255,255,255,0.06)'; c.fill();
    if (k > 0) {
      const bw = Math.max(row * 0.42, w * (b.value / max) * k);
      const draw = () => { M.roundRect(c, x, y + row * 0.18, bw, row * 0.42, row * 0.21); c.fillStyle = hot ? th.color : FX.alpha(th.color, 0.45); c.fill(); };
      hot ? FX.glow(c, draw, { color: th.color, blur: 30, strength: 0.7 }) : draw();
      const v = Number.isInteger(b.value) ? Math.round(b.value * k) : (b.value * k).toFixed(1);
      M.text(c, `${v}${D.unit === "none" ? "" : D.unit}`, x + bw + 20, y + row * 0.5, { font: `700 36px ${LF.F.mono}`, color: hot ? th.color : th.ink });
    }
  });
  if (D.source) M.text(c, D.source, 120, 1010, { font: `600 22px ${LF.F.mono}`, color: th.muted, alpha: 0.8 * M.prog(t, 1.2, 0.4) });
  endCam();
  FX.vignette(c, { strength: 0.45 });
}
</script>
</body>
</html>
