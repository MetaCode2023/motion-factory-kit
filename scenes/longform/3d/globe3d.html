<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Globe 3D: places and the links between them</title>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
// 3D insert: the Earth as a globe of glowing land dots. Places light up when the speaker names them, arcs
// fly between them, and the globe turns to face whatever is being talked about.
// Data: dur, kicker, headline, accent,
//   points: "New York; London; Tokyo; Riyadh=24.7,46.7"  (a known place name, or Name=lat,lon),
//   arcs: "New York>London; New York>Tokyo" (or hub: "New York" to link the hub to every other point),
//   flow: true (pulses travel along the arcs), value + label (a big figure, bottom-left), source
import { stage, THREE, schedule, prog, ease, clamp, lerp, hudTitle, hudText, vignette, FONT, TAU } from './kit3d.js';
import { isLand } from './land.js';

const PLACES = { 'new york': [40.7, -74], 'washington': [38.9, -77], 'los angeles': [34.05, -118.25], 'san francisco': [37.8, -122.4], 'chicago': [41.9, -87.6], 'houston': [29.8, -95.4], 'toronto': [43.7, -79.4], 'mexico city': [19.4, -99.1],
  'sao paulo': [-23.5, -46.6], 'buenos aires': [-34.6, -58.4], 'london': [51.5, -0.1], 'paris': [48.85, 2.35], 'frankfurt': [50.1, 8.7], 'berlin': [52.5, 13.4], 'zurich': [47.4, 8.5], 'brussels': [50.85, 4.35], 'moscow': [55.75, 37.6],
  'istanbul': [41, 29], 'cairo': [30, 31.2], 'lagos': [6.5, 3.4], 'nairobi': [-1.3, 36.8], 'johannesburg': [-26.2, 28], 'riyadh': [24.7, 46.7], 'dubai': [25.2, 55.3], 'tehran': [35.7, 51.4], 'mumbai': [19.1, 72.9], 'delhi': [28.6, 77.2],
  'beijing': [39.9, 116.4], 'shanghai': [31.2, 121.5], 'hong kong': [22.3, 114.2], 'singapore': [1.35, 103.8], 'tokyo': [35.7, 139.7], 'seoul': [37.55, 127], 'jakarta': [-6.2, 106.8], 'sydney': [-33.9, 151.2],
  'united states': [39, -98], 'usa': [39, -98], 'china': [35, 104], 'europe': [50, 10], 'japan': [36, 138], 'india': [21, 78], 'brazil': [-10, -52], 'russia': [60, 90], 'saudi arabia': [24, 45], 'uk': [54, -2], 'africa': [2, 21], 'australia': [-25, 134] };

const S = await stage({ dur: 8, kicker: 'AROUND THE WORLD', headline: 'One currency, everywhere', accent: 'everywhere', points: 'New York; London; Frankfurt; Tokyo; Shanghai; Riyadh; Sao Paulo', hub: 'New York', arcs: '', flow: true, value: '', label: '', source: '' }, { shadows: false });
const { D, th, scene, camera } = S;
const R = 2.2;
const xyz = (lat, lon, r = R) => { const p = (90 - lat) * Math.PI / 180, l = (lon + 180) * Math.PI / 180; return new THREE.Vector3(-r * Math.sin(p) * Math.cos(l), r * Math.cos(p), r * Math.sin(p) * Math.sin(l)); };
const PTS = (Array.isArray(D.points) ? D.points : String(D.points).split(';')).map((s) => String(s).trim()).filter(Boolean).map((s) => {
  const [name, ll] = s.split('='); const c = ll ? ll.split(',').map(Number) : PLACES[name.trim().toLowerCase()];
  return c ? { name: name.trim(), lat: c[0], lon: c[1], pos: xyz(c[0], c[1]) } : null;
}).filter(Boolean);
const byName = (n) => PTS.find((p) => p.name.toLowerCase() === String(n).trim().toLowerCase());
let ARCS = String(D.arcs || '').split(';').map((s) => s.split('>').map(byName)).filter((a) => a[0] && a[1]);
if (!ARCS.length && D.hub && byName(D.hub)) ARCS = PTS.filter((p) => p !== byName(D.hub)).map((p) => [byName(D.hub), p]);
const AT = schedule(D, PTS.map((p) => p.name), { start: 0.8, end: D.dur - 2, gap: 0.45 });
const tOf = (p) => AT[PTS.indexOf(p)];

// ---- the globe: dark ocean, land as instanced dots, a soft atmosphere ----
const globe = new THREE.Group(); scene.add(globe);
globe.add(new THREE.Mesh(new THREE.SphereGeometry(R * 0.995, 64, 48), new THREE.MeshBasicMaterial({ color: '#0A1727' })));
const N = 9000, dots = [];
for (let i = 0; i < N; i++) { const y = 1 - (2 * (i + 0.5)) / N, lat = Math.asin(y) * 180 / Math.PI, lon = ((i * 137.50776405) % 360) - 180; if (isLand(lat, lon)) dots.push(xyz(lat, lon, R * 1.002)); }
const dotMesh = new THREE.InstancedMesh(new THREE.CircleGeometry(0.019, 6), new THREE.MeshBasicMaterial({ color: th.color, transparent: true, opacity: 0.75, side: THREE.DoubleSide }), dots.length);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), Z = new THREE.Vector3(0, 0, 1), one = new THREE.Vector3(1, 1, 1);
dots.forEach((p, i) => { q.setFromUnitVectors(Z, p.clone().normalize()); m4.compose(p, q, one); dotMesh.setMatrixAt(i, m4); });
globe.add(dotMesh);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.13, 48, 32), new THREE.ShaderMaterial({ transparent: true, side: THREE.BackSide, depthWrite: false, uniforms: { c: { value: new THREE.Color(th.color) } },
  vertexShader: 'varying vec3 n; void main(){ n = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 c; varying vec3 n; void main(){ float k = pow(0.72 - dot(n, vec3(0.0, 0.0, 1.0)), 3.0); gl_FragColor = vec4(c, clamp(k, 0.0, 1.0) * 0.5); }' }));
scene.add(atmo);
scene.fog = null; S.key.intensity = 1.2; S.key.position.set(5, 4, 6);

// ---- places and arcs ----
const pins = PTS.map((p) => { const g = new THREE.Group(); g.position.copy(p.pos); g.quaternion.setFromUnitVectors(Z, p.pos.clone().normalize());
  const core = new THREE.Mesh(new THREE.CircleGeometry(0.045, 20), new THREE.MeshBasicMaterial({ color: '#ffffff', side: THREE.DoubleSide })); core.position.z = 0.012; g.add(core);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.085, 32), new THREE.MeshBasicMaterial({ color: th.warm, transparent: true, side: THREE.DoubleSide })); ring.position.z = 0.01; g.add(ring);
  globe.add(g); return { g, core, ring }; });
const arcs = ARCS.map(([a, b]) => {
  const mid = a.pos.clone().add(b.pos).multiplyScalar(0.5), d = a.pos.distanceTo(b.pos);
  mid.setLength(R + 0.12 + d * 0.2);
  const curve = new THREE.QuadraticBezierCurve3(a.pos.clone().setLength(R * 1.005), mid, b.pos.clone().setLength(R * 1.005));
  const geo = new THREE.TubeGeometry(curve, 64, 0.012, 6, false);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: th.warm, transparent: true, opacity: 0.95 }));
  globe.add(mesh);
  const pulse = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 12), new THREE.MeshBasicMaterial({ color: '#ffffff' })); globe.add(pulse);
  return { a, b, curve, mesh, pulse, n: geo.index.count, at: Math.max(tOf(a), tOf(b)) };
});

// The globe turns so the point being named faces the camera (yaw only, with a slow constant drift).
const yawFor = (p) => Math.atan2(-p.pos.x, p.pos.z);   // rotation.y that brings p to +z
const KEYS = PTS.map((p, i) => ({ t: AT[i], yaw: yawFor(p) }));
for (let i = 1; i < KEYS.length; i++) { let d = KEYS[i].yaw - KEYS[i - 1].yaw; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; KEYS[i].yaw = KEYS[i - 1].yaw + d * 0.62; }   // most of the way: far places come into view, without a whip
function yawAt(t) {
  if (!KEYS.length) return t * 0.15;
  let y = KEYS[0].yaw - 0.5;
  KEYS.forEach((k, i) => { const from = i ? KEYS[i - 1].yaw : KEYS[0].yaw - 0.5; y = lerp(i ? y : from, k.yaw, ease.inOutCubic(clamp((t - (k.t - 1.0)) / 1.3))); });
  return y + 0.06 * Math.max(0, t - KEYS[KEYS.length - 1].t);
}

S.run({
  sfx: [{ at: 0.1, name: 'riser', volume: 0.3 }, ...AT.map((at) => ({ at, name: 'pop', volume: 0.5 })), ...arcs.map((a) => ({ at: a.at + 0.1, name: 'whoosh', volume: 0.22 }))],
  update(t) {
    const zoom = ease.inOutCubic(clamp(t / D.dur));
    // straight on, the globe on the right two-fifths and below the headline, whole (atmosphere included) inside the frame
    camera.position.set(-2.9, 0.46, 12.1 - 0.8 * zoom); camera.lookAt(-2.9, 0.46, 0);
    globe.rotation.set(0.38, yawAt(t), 0);
    pins.forEach((p, i) => { const k = ease.outBack(clamp((t - AT[i]) / 0.4)); p.g.visible = k > 0; p.core.scale.setScalar(k);
      const w = ((t - AT[i]) * 0.9) % 1; p.ring.scale.setScalar(k * (1 + 1.6 * w)); p.ring.material.opacity = 0.9 * (1 - w); });
    arcs.forEach((a, i) => { const k = ease.inOutCubic(clamp((t - a.at - 0.1) / 0.8)); a.mesh.visible = k > 0; a.mesh.geometry.setDrawRange(0, Math.floor((a.n * k) / 36) * 36);
      const on = D.flow !== false && D.flow !== 'false' && k >= 1; a.pulse.visible = on; if (on) a.pulse.position.copy(a.curve.getPoint(((t - a.at) * 0.45 + i * 0.37) % 1)); });
  },
  hud(c, t) {
    vignette(c, 0.5);
    hudTitle(c, t, D, th);
    const camDir = camera.position.clone().normalize();
    PTS.forEach((p, i) => {
      const a = prog(t, AT[i] + 0.1, 0.3); if (a <= 0) return;
      const w = p.pos.clone().applyEuler(globe.rotation), facing = w.clone().normalize().dot(camDir);
      if (facing < 0.38) return;                                   // on the far side or right on the edge
      const s = S.project(w.clone().multiplyScalar(1.05)), latest = AT.filter((x) => x <= t).length - 1 === i;
      const flip = s.x > 1560;   // near the right edge the name goes to the left of its pin, so it stays in frame
      hudText(c, p.name, s.x + (flip ? -16 : 16), s.y - 12, { font: `${latest ? 800 : 600} ${latest ? 38 : 28}px ${FONT.display}`, color: latest ? th.ink : th.muted, align: flip ? 'right' : 'left', alpha: a * clamp((facing - 0.38) * 4) });
    });
    if (D.value) {
      const at = Math.min(D.dur - 1.5, (AT[AT.length - 1] || 1) + 0.6), k = ease.outBack(clamp((t - at) / 0.5));
      if (k > 0) { c.save(); c.translate(120, 880); c.scale(k, k); hudText(c, D.value, 0, 0, { font: `800 120px ${FONT.display}`, color: th.warm }); c.restore(); hudText(c, D.label || '', 124, 940, { font: `600 38px ${FONT.display}`, color: th.ink, alpha: prog(t, at + 0.2, 0.4) }); }
    }
    if (D.source) hudText(c, D.source, 120, 1030, { font: `600 22px ${FONT.mono}`, color: th.muted, alpha: 0.8 * prog(t, 1, 0.4), shadow: false });
  },
});
</script>
</body>
</html>
