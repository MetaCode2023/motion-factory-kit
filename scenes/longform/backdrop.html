<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Backdrop: base layer for voice-only videos</title>
<script src="../../brand.js"></script>
<script src="../../kit/motion.js"></script>
<script src="../../kit/fx.js"></script>
<script src="lf.js"></script>
</head>
<body>
<script>
// 16:9 loop used as the picture under a voice-only recording between inserts (the build loops it and
// adds captions on top). Seamless at `dur`. Data: dur, color, tint
const D = M.data({ dur: 12 });
const th = LF.theme(D);
M.setup({ preset: 'youtube', duration: D.dur, background: '#05060A', draw });
function draw(c, t) {
  const p = (t / D.dur) * Math.PI * 2;
  LF.ground(c, p, th);
  const r = FX.rng(3);
  for (let i = 0; i < 70; i++) {
    const x = r() * 1920, y = r() * 1080, ph = r() * 6.28, s = 1 + r() * 2;
    c.globalAlpha = 0.12 + 0.18 * (0.5 + 0.5 * Math.sin(p * 2 + ph));
    c.fillStyle = th.color; c.beginPath(); c.arc(x + 12 * Math.sin(p + ph), y + 12 * Math.cos(p + ph), s, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
  LF.vignette(c, th, 0.6);
}
</script>
</body>
</html>
