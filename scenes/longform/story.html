<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Story: show it with objects</title>
<script src="../../brand.js"></script>
<script src="../../kit/motion.js"></script>
<script src="../../kit/fx.js"></script>
<script src="lf.js"></script>
<script src="poker.js"></script>
<script src="props.js"></script>
</head>
<body>
<script>
// 16:9 template: the "show it, don't write it" engine. Drawn objects (props.js) appear one by one ON the
// words that name them, joined by arrows with things flowing along them, while the camera travels to
// follow the action. 2-6 beats; labels of 1-3 words.
// Data: dur, kicker, headline (optional, small), beats: "bank=The Fed - creates money; coin=New dollars; person=You"
//   (or [{ prop, label, sub, say }]; "say" = the words that trigger it, default the label; or a top-level
//   say: "word; word; word", one per beat),
//   flow (a prop that travels along the arrows, e.g. coin), layout: row | loop, arrows (default true)
const D = M.data({ dur: 7, kicker: '', headline: '', beats: 'bank=The bank - writes a loan; coin=New money; person=You - spend it; house=The seller - deposits it', flow: 'coin', layout: 'row', arrows: true });
const th = LF.theme(D);
const B = Array.isArray(D.beats) ? D.beats : String(D.beats).split(';').filter((p) => p.trim()).map((p) => {
  const [prop, rest = ''] = p.split('='); const [label, ...sub] = rest.split(/\s+[-–—]\s+/);
  return { prop: prop.trim(), label: label.trim(), sub: sub.join(' - ').trim() };
});
const n = B.length, LOOP = D.layout === 'loop';
const SAY = D.say ? String(D.say).split(';').map((x) => x.trim()) : [];   // "say: bet; measuring; answer" = trigger words per beat
const AT = LF.schedule(D, B.map((b, i) => b.say || SAY[i] || b.label), { start: 0.4, end: D.dur - 1.6, gap: 0.5 });
// World positions: a row (camera travels if it doesn't fit) or a loop (all on screen).
const STEP = 560, ROWY = D.headline ? 560 : 520;
const POS = B.map((_, i) => LOOP ? [960 + 560 * Math.cos(-Math.PI / 2 + (i / n) * Math.PI * 2), 560 + 300 * Math.sin(-Math.PI / 2 + (i / n) * Math.PI * 2)] : [i * STEP, ROWY]);
const SPAN = (n - 1) * STEP, FITS = LOOP || SPAN <= 1300;
const SIZE = LOOP ? 170 : 220;
M.setup({ preset: 'youtube', duration: D.dur, background: '#05060A', draw, look: 'cinematic',
  sfx: AT.flatMap((at, i) => [{ at, name: 'pop', volume: 0.55 }, ...(!FITS && i > 0 ? [{ at: at - 0.35, name: 'whoosh', volume: 0.25 }] : [])]) });

function camX(t) {   // world x at the screen centre
  if (FITS) return LOOP ? 960 : SPAN / 2;
  let x = 0;
  AT.forEach((at, i) => { const k = M.ease.inOutCubic(M.clamp((t - (at - 0.45)) / 0.6)); if (k > 0) x = (i ? POS[i - 1][0] + (POS[i][0] - POS[i - 1][0]) * k : POS[0][0]); });
  return Math.max(560, Math.min(SPAN - 560, x));   // keep the row's ends from drifting off-screen
}
function arrow(c, t, a, b, k, i) {
  const [x1, y1] = a, [x2, y2] = b, d = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / d, uy = (y2 - y1) / d, pad = SIZE * 0.62;
  const sx = x1 + ux * pad, sy = y1 + uy * pad, ex = x2 - ux * pad, ey = y2 - uy * pad;
  const mx = sx + (ex - sx) * k, my = sy + (ey - sy) * k;
  c.save(); c.strokeStyle = FX.alpha(th.color, 0.8); c.lineWidth = 5; c.setLineDash([16, 12]); c.lineDashOffset = -t * 50;
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(mx, my); c.stroke(); c.setLineDash([]);
  if (k > 0.98) { const ang = Math.atan2(uy, ux); c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex - 22 * Math.cos(ang - 0.5), ey - 22 * Math.sin(ang - 0.5)); c.lineTo(ex - 22 * Math.cos(ang + 0.5), ey - 22 * Math.sin(ang + 0.5)); c.closePath(); c.fillStyle = th.color; c.fill(); }
  c.restore();
  if (D.flow && k > 0.98) for (let j = 0; j < 2; j++) { const u = ((t * 0.45 + j * 0.5 + i * 0.13) % 1); PR.draw(c, D.flow, sx + (ex - sx) * u, sy + (ey - sy) * u - 4, 46, { color: th.warm, shadow: false, alpha: Math.sin(Math.PI * u) }); }
}
function draw(c, t) {
  LF.backdrop(c, t, th);
  if (D.headline || D.kicker) LF.title(c, t, D, th, { width: 1600 });
  const end = LF.drift(c, t, D, { zoom: 0.04 });
  c.save();
  if (!LOOP) c.translate(960 - camX(t), 0);
  B.forEach((b, i) => {
    if (i > 0) arrow(c, t, POS[i - 1], POS[i], M.ease.inOutCubic(M.clamp((t - AT[i] + 0.35) / 0.4)), i);
  });
  if (LOOP && D.arrows !== false) arrow(c, t, POS[n - 1], POS[0], M.ease.inOutCubic(M.clamp((t - AT[n - 1] - 0.5) / 0.6)), n);
  let active = -1; AT.forEach((a, i) => { if (t >= a) active = i; });
  B.forEach((b, i) => {
    const k = PR.pop(t, AT[i]);
    if (k <= 0) return;
    const [x, y] = POS[i], on = i === active;
    c.save(); c.translate(x, y + PR.bob(t, i)); c.scale(k, k);
    if (on) { c.save(); const g = c.createRadialGradient(0, 0, 10, 0, 0, SIZE); g.addColorStop(0, FX.alpha(th.color, 0.28 + 0.12 * LF.pulse(t, 3))); g.addColorStop(1, FX.alpha(th.color, 0)); c.fillStyle = g; c.fillRect(-SIZE, -SIZE, SIZE * 2, SIZE * 2); c.restore(); }
    PR.draw(c, b.prop, 0, 0, SIZE, { color: on ? th.color : FX.alpha(th.color, 0.85), alpha: on || active < 0 ? 1 : 0.8 });
    c.restore();
    const la = M.prog(t, AT[i] + 0.12, 0.35);
    M.text(c, b.label, x, y + SIZE * 0.72 + 30, { font: `800 ${LOOP ? 40 : 50}px ${LF.F.display}`, color: on ? th.ink : FX.alpha(th.ink, 0.8), align: 'center', alpha: la });
    if (b.sub) M.text(c, b.sub, x, y + SIZE * 0.72 + (LOOP ? 72 : 84), { font: `600 ${LOOP ? 28 : 32}px ${LF.F.display}`, color: th.muted, align: 'center', alpha: M.prog(t, AT[i] + 0.3, 0.35) });
  });
  c.restore();
  end();
  FX.vignette(c, { strength: 0.5 });
}
</script>
</body>
</html>
