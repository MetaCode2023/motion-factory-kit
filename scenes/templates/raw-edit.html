<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Raw footage edit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600&display=block">
<script src="../../brand.js"></script>
<script src="../../kit/motion.js"></script>
<script src="../../kit/blocks.js"></script>
<script src="../../kit/fx.js"></script>
</head>
<body>
<script>
// The polish layer for an ad cut from raw footage by footage.mjs. Everything comes from the edit
// plan (M.data), so `node footage.mjs build edits/` runs this once per plan. Opened on its own it
// shows a placeholder so you can check the layout.
const D = M.data({
  name: 'preview', aroll: '../../assets/footage-preview.mp4', duration: 15,
  hooks: ['I tried every brand so you don\'t have to'], comment: null, cta: 'Shop now',
  product: null, productAt: null, broll: [], music: 'pulse', look: 'punchy', endCard: null,
  segments: [], street: null, tally: null, captionStyle: null, hookStyle: 'box',
});
const HOOK = M.pick(D.hooks.length ? D.hooks : ['']);
const DUR = D.duration;
const HOOK_END = Math.min(3.4, DUR * 0.3);
const CTA_AT = Math.max(HOOK_END + 1, DUR - 2.6);
const PRODUCT_AT = D.product ? (D.productAt ?? Math.max(HOOK_END + 0.5, DUR * 0.45)) : null;

M.setup({
  post: { caption: D.caption || [HOOK, D.cta].filter(Boolean).join('\n\n'), hashtags: [].concat(D.hashtags || []) }, voiceId: D.voiceId || null,
  width: 1080, height: 1920, fps: 30, duration: DUR, background: '#000',
  cuts: D.broll.flatMap((b) => [b.at, b.at + b.dur]).filter((x) => x > 0 && x < DUR),
  captions: D.captionStyle ? { style: D.captionStyle, ...(D.captionStyle === 'word' ? { position: 0.68 } : {}) } : true, look: D.look, music: D.music ? { track: D.music, volume: 0.1 } : null,
  sfx: [
    { at: 0, name: 'pop', volume: 0.45 },
    ...D.broll.map((b) => ({ at: Math.max(0, b.at - 0.15), name: 'whoosh', volume: 0.3 })),
    ...(PRODUCT_AT != null ? [{ at: PRODUCT_AT + 0.15, name: 'coin', volume: 0.4 }] : []),
    ...(D.cta ? [{ at: CTA_AT + 1.3, name: 'tap', volume: 0.5 }] : []),
  ],
  draw,
});

const aroll = M.video(D.aroll, { at: 0, captions: true, transcript: HOOK });
const cutaways = D.broll.map((b) => ({ ...b, clip: M.video(b.src, { at: b.at, audio: false }) }));

// Street-interview overlays from the plan: the question card stays up through the answers that
// follow it, each person gets a name lower-third and an "n/total" chip, and an optional poll bar.
const ST = D.street || {};
const SEGS = (D.segments || []).map((s, i, all) => ({ ...s, next: all[i + 1]?.start ?? DUR }));
const QUESTIONS = SEGS.filter((s) => s.question).map((s, k, qs) => ({ text: s.question, at: Math.max(s.start, D.hooks.length ? HOOK_END : 0), until: qs[k + 1]?.start ?? (D.tally ? TALLY_AT() : CTA_AT - 0.1) }));
let count = 0;
const PEOPLE = SEGS.filter((s) => !s.question).map((s) => ({ ...s, n: s.n ?? ++count }));
function TALLY_AT() { return D.tally?.at ?? Math.max(HOOK_END + 1.5, CTA_AT - 2.4); }
function street(ctx, t) {
  let below = 250;
  for (const q of QUESTIONS) {
    const r = B.questionCard(ctx, t, { at: q.at, until: q.until, text: q.text, label: ST.label ?? 'We asked', y: 250 });
    if (t >= q.at && t < q.until) below = r.bottom + 24;
  }
  for (const p of PEOPLE) {
    if (p.person) B.lowerThird(ctx, t, { at: p.start + 0.25, until: Math.min(p.next, p.start + 2.8, D.tally ? TALLY_AT() : Infinity), ...p.person });
    if (ST.total && ST.count !== false && t >= HOOK_END) B.counter(ctx, t, { at: p.start, until: p.next, n: p.n, total: ST.total, y: below });
  }
  if (ST.intro && ST.total) B.counter(ctx, t, { at: 0, until: HOOK_END, mode: 'big', total: ST.total, label: ST.introLabel || 'people asked', y: 900 });
  if (D.tally) B.tally(ctx, t, { at: TALLY_AT(), until: CTA_AT - 0.1, ...D.tally, y: 860 });   // below the face (reframing puts it at ~38% height)
}

function draw(ctx, t) {
  // Picture: the A-roll, with B-roll cutaways over it (the voice keeps going underneath).
  const b = cutaways.find((c) => t >= c.at && t < c.at + c.dur);
  if (b) b.clip.draw(ctx, t, 0, 0, 1080, 1920, { zoom: 1 + 0.05 * M.clamp((t - b.at) / b.dur) });
  else aroll.draw(ctx, t, 0, 0, 1080, 1920);
  FX.vignette(ctx, { strength: 0.25 });

  // Hook: optional comment sticker, then the hook text. On screen at frame 0.
  let y = 300;
  if (D.comment) y = B.commentReply(ctx, t, { at: 0, until: HOOK_END, user: D.comment.user || 'customer', text: D.comment.text || D.comment, y: 250 }).bottom + 30;
  if (HOOK) B.nativeText(ctx, t, { at: 0, until: HOOK_END, text: HOOK, y, style: D.hookStyle || 'box' });

  if (D.product && PRODUCT_AT != null) {
    B.productCard(ctx, t, { at: PRODUCT_AT, until: Math.min(CTA_AT - 0.2, PRODUCT_AT + 3.6), ...D.product,
      image: D.product.image ? M.image(D.product.image) : null, y: 860 });
  }
  street(ctx, t);
  if (D.cta) B.ctaButton(ctx, t, { at: CTA_AT, text: D.cta, y: 1020, tapAt: CTA_AT + 1.3 });
  if (D.endCard) B.endCard(ctx, t, { at: DUR - 2, ...D.endCard });
}
</script>
</body>
</html>
