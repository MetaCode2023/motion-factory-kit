<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Paper cutout</title>
<script src="../../kit/motion.js"></script>
<script src="../../kit/fx.js"></script>
</head><body><script>
// Cutaway built from a script line. Data: title, subject, palette, layout.
const data = M.data();
const title = data.title || 'Ideas take shape';
const subject = data.subject || 'idea';
const stack = data.layout === 'stack';
const tone = ({ amber: '#efad55', teal: '#67bdae', violet: '#b29ae1' })[data.palette] || '#efad55';
const random = FX.rng(144);
const flecks = Array.from({ length: 1500 }, () => [random()*960, random()*540, 0.4+random()*1.3]);
function paper(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x+4,y); ctx.lineTo(x+w,y+4); ctx.lineTo(x+w-3,y+h);
  ctx.lineTo(x,y+h-3); ctx.closePath(); ctx.fill();
}
function symbol(ctx) {
  ctx.fillStyle = '#212d34';
  if (subject === 'document') {
    paper(ctx,-54,-73,108,146,'#253238');
    for (let i=0;i<4;i++) paper(ctx,-35,-44+i*25,i===3?44:71,6,'#ead9b8');
  } else if (subject === 'signal') {
    ctx.lineWidth=12; ctx.strokeStyle='#253238';
    for (const radius of [33,61,88]) {
      ctx.beginPath(); ctx.arc(0,40,radius,Math.PI*1.19,Math.PI*1.81); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,40,9,0,Math.PI*2); ctx.fill();
  } else if (subject === 'growth') {
    for (let i=0;i<4;i++) paper(ctx,-77+i*39,65-(i+1)*33,29,(i+1)*33,'#253238');
  } else {
    ctx.beginPath(); ctx.arc(0,-15,53,0,Math.PI*2); ctx.fill();
    paper(ctx,-24,37,48,24,'#253238');
    paper(ctx,-15,68,30,9,'#253238');
  }
}
M.setup({
  width:960,height:540,duration:6,fps:30,background:'#ead9b8',
  music:{track:'reflect',volume:0.17},
  draw(ctx,t) {
    const x = stack ? 654 : 480;
    const y = stack ? 259 : 305;
    const opening = M.prog(t,0,1.2);
    const hue = ctx.createLinearGradient(0,0,960,540);
    const sweep = .12 + .58*opening - .27*(1-Math.cos(Math.max(0,t-1.2)*1.75));
    hue.addColorStop(0,'#ead9b8'); hue.addColorStop(sweep,'#a99578'); hue.addColorStop(1,'#ead9b8');
    ctx.fillStyle=hue; ctx.fillRect(0,0,960,540);
    ctx.fillStyle='#58452d22';
    for (const [gx,gy,r] of flecks) ctx.fillRect(gx,gy,r,r);
    const stepped = Math.floor(t*14)/14;
    const rise = M.prog(stepped,0.04,0.83,M.ease.outCubic);
    ctx.save();
    ctx.translate(x,y+92*(1-rise)+7*Math.sin(stepped*1.8));
    ctx.rotate(-0.27*(1-rise)+0.028*Math.sin(stepped*2.2));
    paper(ctx,-128,-124,259,250,'#55463866');
    paper(ctx,-139,-132,259,250,'#f3e6ce');
    ctx.rotate(0.12);
    paper(ctx,-116,-114,232,228,tone);
    symbol(ctx);
    ctx.restore();
    const size = stack ? 43 : 54;
    const align = stack ? 'left' : 'center';
    const tx = stack ? 71 : 480;
    const ty = stack ? 273 : 112;
    ctx.save();
    ctx.font = `bold ${size}px sans-serif`;
    const scale = Math.min(1,(stack?400:830)/ctx.measureText(title).width);
    ctx.translate(tx,ty); ctx.scale(scale,scale);
    M.text(ctx,title,0,0,{font:`bold ${size}px sans-serif`,align,color:'#212d34'});
    ctx.restore();
  },
});
</script></body></html>
