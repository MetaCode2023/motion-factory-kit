<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Underwater documentary · 6 s visual refinement demo</title>
<script src="../../kit/motion.js"></script>
</head>
<body>
<script>
// A 6-second underwater documentary shot, built for the visual refinement loop (docs/VISUAL-REFINEMENT.md).
// One continuous move: open water with light shafts (establishing), the camera cranes up and tilts
// down onto a turtle gliding over a caustic-lit floor (hero), then focus racks onto marine snow
// drifting just in front of the lens (macro).
//
// Every look decision is a parameter (M.data), so the loop can tune it without rewriting code:
// render_still / refine_still pass them as data. resolutionScale renders low-res motion previews.
const D = M.data({
  exposure: 1.0,          // overall brightness
  depthFalloff: 1.0,      // how fast light dies with depth and distance (atmospheric perspective)
  waterHue: 200,          // degrees
  waterSaturation: 0.7,
  deepLevel: 0.16,        // brightness of the deepest water (0-1)
  warmth: 0.0,            // -1 cool ... +1 warm sunlight
  rayIntensity: 0.35,     // volumetric light shafts
  rayCount: 6,
  raySpread: 0.5,         // how wide the shafts fan
  raySoftness: 8,         // px blur on the shaft layer
  causticIntensity: 0.4,  // caustics on floor and subject
  causticScale: 1.0,
  causticSpeed: 1.0,      // temporal: ripple speed
  causticOnSubject: 0.3,
  surfaceIntensity: 0.4,  // brightness of the rippled surface seen from below
  floorLevel: 0.5,        // sand brightness under the caustic net
  waterGlow: 0.3,         // in-scattered blue light in open water (mid-water haze brightness)
  shellDetail: 0.4,       // scute contrast on the shell
  sss: 0.2,               // light passing through thin flipper edges (subsurface stand-in)
  ambientOcclusion: 0.4,
  snowDensity: 1.0,
  snowSize: 1.0,
  snowLightFollow: 0.2,   // 0: snow lit evenly (default noise look) ... 1: snow glints only inside the shafts
  snowDrift: 1.0,         // temporal: drift speed
  focusRack: 1.0,         // 0 keeps focus on the subject; 1 racks to the snow
  aperture: 1.0,          // depth-of-field strength
  cameraPush: 0.25,
  cameraSmoothing: 0.5,   // temporal: 0 linear moves (hard starts/stops) ... 1 eased
  cameraShake: 0.15,      // temporal: handheld shake
  grain: 0.4,
  vignette: 0.35,
  resolutionScale: 1,
});

const S = Math.max(0.1, Math.min(1, D.resolutionScale));
const W = Math.round(1920 * S), H = Math.round(1080 * S);
const DUR = 6;

// ---- determinism: seeded noise only (time is the only state) --------------------------------
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry(20261128);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (k) => { k = clamp(k, 0, 1); return k * k * k * (k * (k * 6 - 15) + 10); };
// cameraSmoothing blends a linear ramp (abrupt) with smootherstep (eased).
const move = (t, a, b) => { const k = clamp((t - a) / (b - a), 0, 1); return lerp(k, smooth(k), D.cameraSmoothing); };

function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const f = (n) => { const k = (n + h * 12) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}

// ---- camera ------------------------------------------------------------------------------------
// tilt: 0 = level, looking slightly up at the surface; 1 = craned up, looking down at the floor.
function camera(t) {
  const tilt = move(t, 0.7, 3.3);
  const push = move(t, 0, DUR) * D.cameraPush;
  // Shake: two incommensurate sines per axis, deterministic in t.
  const sh = D.cameraShake * 9;
  const sx = sh * (Math.sin(t * 23.1) * 0.6 + Math.sin(t * 37.7 + 1.3) * 0.4);
  const sy = sh * (Math.sin(t * 19.3 + 0.7) * 0.6 + Math.sin(t * 41.9 + 2.1) * 0.4);
  // Focus distance in metres: on the subject, then racked to the snow near the lens.
  const rack = move(t, 3.7, 5.0) * D.focusRack;
  const focus = lerp(7.5, 1.0, rack);
  return { tilt, pitch: lerp(0.16, -0.62, tilt), camY: lerp(0.0, 3.2, tilt), camZ: push * 6 + t * 0.35, zoom: 1 + push, sx, sy, focus, rack };
}

// ---- water colour ------------------------------------------------------------------------------
function palette() {
  const water = hsl(D.waterHue, D.waterSaturation, 0.42);
  const deep = hsl(D.waterHue + 12, D.waterSaturation * 0.9, D.deepLevel * 0.5);
  const sun = [1.0 + 0.12 * D.warmth, 0.97, 0.9 - 0.18 * D.warmth];
  return { water, deep, sun };
}

// ---- per-pixel surfaces (low res): the underside of the surface and the caustic floor ----------
const RW = Math.round(480 * S), RH = Math.round(270 * S);
const surf = document.createElement('canvas'); surf.width = RW; surf.height = RH;
const sctx = surf.getContext('2d');
const sdata = sctx.createImageData(RW, RH);
const SURFACE = 9, FLOOR = -3.2, TANF = Math.tan(0.62);
// Caustic net: light focused into thin bright lines that outline drifting cells (F2-F1 Voronoi),
// the way a rippled surface projects onto sand.
function hash2(i, j) { let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function cellEdge(x, z, w) {
  const ix = Math.floor(x), iz = Math.floor(z);
  let f1 = 9, f2 = 9;
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
    const ci = ix + a, cj = iz + b, h1 = hash2(ci, cj), h2 = hash2(cj + 71, ci - 13);
    const cx = ci + 0.5 + 0.4 * Math.sin(w + h1 * 6.28), cz = cj + 0.5 + 0.4 * Math.cos(w * 0.8 + h2 * 6.28);
    const dd = (x - cx) * (x - cx) + (z - cz) * (z - cz);
    if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) f2 = dd;
  }
  return Math.sqrt(f2) - Math.sqrt(f1);
}
function caustic(x, z, t) {
  const k = 1.1 / D.causticScale, w = t * D.causticSpeed * 0.6;
  x *= k; z *= k;
  // Domain warp: curved, uneven cells instead of a tiled mesh.
  const wx = x + 0.35 * Math.sin(z * 1.7 + w * 0.7) + 0.18 * Math.sin(z * 4.1 - w), wz = z + 0.35 * Math.sin(x * 1.5 - w * 0.6) + 0.18 * Math.cos(x * 3.7 + w);
  const big = Math.pow(clamp(1 - cellEdge(wx, wz, w) * 4.5, 0, 1), 9);
  const small = Math.pow(clamp(1 - cellEdge(wx * 2.3 + 5, wz * 2.3 - 3, w * 1.3) * 4, 0, 1), 9) * 0.45;
  // Uneven line weight: focus varies across the net.
  const focus = 0.45 + 0.55 * Math.pow(0.5 + 0.5 * Math.sin(wx * 0.9 + wz * 0.6 + w * 0.4), 2);
  return (big + small) * focus;
}
function ripple(x, z, t) {
  const k = 0.9 / D.causticScale, w = t * D.causticSpeed;
  let v = Math.sin(x * k + Math.sin(z * 0.7 * k + w * 0.9) * 1.6 + w * 0.7);
  v += Math.sin(z * 1.1 * k - x * 0.4 * k + Math.sin(x * 0.55 * k - w * 0.6) * 1.3);
  v += Math.sin((x + z) * 0.6 * k + 2.1 + w * 0.5);
  v = Math.abs(v) / 3;
  return Math.pow(1 - v, 5);
}
function shaftBand(x, z) { const b = 0.5 + 0.5 * Math.sin(x * 0.55 + Math.sin(z * 0.08) * 1.2 + 0.4); return 0.25 + 1.3 * b * b * b * b; }
function renderSurfaces(t, cam, P) {
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const sig = [0.32 * D.depthFalloff, 0.075 * D.depthFalloff, 0.045 * D.depthFalloff];
  const d = sdata.data;
  for (let py = 0; py < RH; py++) {
    const v = (1 - (py + 0.5) / RH * 2) * TANF * 9 / 16;
    for (let px = 0; px < RW; px++) {
      const u = ((px + 0.5) / RW * 2 - 1) * TANF;
      // Rotate the view ray by the camera pitch.
      let dy = v * cp + sp, dz = cp - v * sp, dx = u;
      const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;
      // Open water seen along this ray: brighter toward the surface, lit by in-scattered blue.
      const ow = (yy) => { const u2 = clamp(yy * 2.2, -1, 1); return [0, 1, 2].map((i) => lerp(P.deep[i], P.water[i] * (0.6 + D.waterGlow), clamp(0.5 + u2 * 0.5, 0, 1)) * Math.exp(u2 * 1.2 - 0.4)); };
      let col = ow(dy);
      let dist = 60;
      if (dy > 0.02) {
        dist = (SURFACE - cam.camY) / dy;
        const x = dx * dist, z = cam.camZ + dz * dist;
        // Snell's window: the ripple is visible looking up and fades out toward grazing angles
        // (where it would alias into a hard sparkle line).
        const graze = smooth((dy - 0.12) / 0.35);
        const c = ripple(x * 0.6, z * 0.6, t) * shaftBand(x, z) * graze;
        const cool = [0.72, 0.92, 1.0];   // the surface reads cyan-white, not green
        col = col.map((cv, i) => cv + cool[i] * c * D.surfaceIntensity * D.exposure * Math.exp(-sig[i] * dist * 0.15));
      } else if (dy < -0.02) {
        dist = (cam.camY - FLOOR) / -dy;
        const x = dx * dist, z = cam.camZ + dz * dist;
        const sand = (0.5 + 0.08 * Math.sin(x * 9.1) * Math.sin(z * 7.3) + 0.05 * Math.sin(x * 2.3 + z * 1.7)) * 1;
        const rock = Math.pow(Math.max(0, Math.sin(x * 0.21 + Math.sin(z * 0.3) * 2)), 3);
        const alb = [sand * 1.05 - rock * 0.3, sand - rock * 0.25, sand * 0.82 - rock * 0.2];
        // Sunlight reaching the sand has crossed the water column (red goes first); the caustic net is
        // sharp where the surface focuses it. Then the view path from the sand back to the lens.
        const key = 0.5 + 0.9 * (1 - clamp((px / RW) * 0.6 + (py / RH) * 0.4, 0, 1));   // the sun key lands upper left
        const grain = 0.92 + 0.16 * hash2(Math.floor(x * 30), Math.floor(z * 30)) + 0.06 * Math.sin(x * 3.1 + Math.sin(z * 1.3) * 2);
        const net = caustic(x, z, t) * shaftBand(x, z) * key;
        // Light on the sand is blue-cyan (red is gone by this depth); in-scattered blue fills the view path.
        const light = sig.map((s2, i) => P.sun[i] * Math.exp(-s2 * (SURFACE - FLOOR) * 0.32) * (D.floorLevel + D.causticIntensity * 3.6 * net) * D.exposure);
        const att = sig.map((s2) => Math.exp(-s2 * dist * 0.8));
        const fill = P.water.map((w) => w * D.waterGlow * 1.25);
        const floor = fill.map((f, i) => f * (1 - att[i]) + alb[i] * grain * light[i] * att[i] * 1.5 + f * 0.35);
        // Fog the far floor into the open-water colour at the horizon, so there is no hard line.
        // Mid-water at the start: the floor is too deep to see until the camera cranes down.
        const fog = Math.max(smooth((dist - 8) / 22), 1 - smooth((cam.tilt - 0.2) / 0.45)), horizon = ow(-0.02);
        col = floor.map((f, i) => lerp(f, horizon[i], fog));
      }
      // Distance haze toward the deep colour.
      const haze = 1 - Math.exp(-dist * 0.03 * D.depthFalloff);
      const o = (py * RW + px) * 4;
      const hz = dy < -0.02 ? 0 : haze * 0.5;
      const hazeCol = ow(dy);
      for (let i = 0; i < 3; i++) d[o + i] = clamp(Math.pow(clamp(lerp(col[i], hazeCol[i], hz), 0, 1), 1 / 1.1) * 255, 0, 255);
      d[o + 3] = 255;
    }
  }
  sctx.putImageData(sdata, 0, 0);
}

// ---- light shafts ------------------------------------------------------------------------------
const shafts = Array.from({ length: 16 }, (_, i) => ({ off: rand() * 2 - 1, w: 0.4 + rand() * 1.2, ph: rand() * 6.28, a: 0.5 + rand() * 0.5 }));
const shaftLayer = document.createElement('canvas'); shaftLayer.width = Math.round(W / 2); shaftLayer.height = Math.round(H / 2);
const shctx = shaftLayer.getContext('2d');
function drawShafts(t, cam, P) {
  const w = shaftLayer.width, h = shaftLayer.height;
  shctx.setTransform(1, 0, 0, 1, 0, 0);
  shctx.clearRect(0, 0, w, h);
  const n = Math.round(clamp(D.rayCount, 0, 16));
  // The source sits above the frame, up and to the left; it slides up out of view as the camera tilts down.
  const ox = w * 0.24, oy = h * lerp(-0.25, -1.1, cam.tilt);
  for (let i = 0; i < n; i++) {
    const s = shafts[i];
    const ang = 0.38 + s.off * D.raySpread * 0.55 + Math.sin(t * 0.35 + s.ph) * 0.025;
    const len = h * 2.2, half = (0.012 + s.w * s.w * 0.03) * w * (0.75 + 0.25 * Math.sin(t * 0.5 + s.ph * 2));
    const ex = ox + Math.sin(ang) * len, ey = oy + Math.cos(ang) * len;
    const g = shctx.createLinearGradient(ox, oy, ex, ey);
    const a = D.rayIntensity * s.a * (0.85 + 0.15 * Math.sin(t * 0.8 + s.ph));
    const c = [0.74, 0.93, 1.0].map((v, k) => Math.round(clamp(v * (0.75 + 0.25 * P.sun[k]), 0, 1) * 255)).join(',');
    // Brightest near the surface, gone by the lower third of the frame.
    const end = clamp((h * 0.72 - oy) / len, 0.2, 1) * lerp(1.15, 0.8, clamp(D.depthFalloff - 0.5, 0, 1.5) / 1.5);
    g.addColorStop(0, `rgba(${c},${a})`);
    g.addColorStop(end * 0.35, `rgba(${c},${a * 0.6})`);
    g.addColorStop(end * 0.7, `rgba(${c},${a * 0.2})`);
    g.addColorStop(Math.min(1, end), `rgba(${c},0)`);
    shctx.fillStyle = g;
    // Three overlapping sub-beams of different widths: soft, uneven edges instead of ruled stripes.
    for (const [kw, ka, ks] of [[1, 0.5, 0], [0.55, 0.35, 0.35], [1.6, 0.2, -0.25]]) {
      shctx.globalAlpha = ka * 2;
      const hw = half * kw, sk = ks * half;
      shctx.beginPath();
      shctx.moveTo(ox - hw * 0.3 + sk * 0.2, oy);
      shctx.lineTo(ex - hw * 1.8 + sk, ey);
      shctx.lineTo(ex + hw * 1.8 + sk, ey);
      shctx.lineTo(ox + hw * 0.3 + sk * 0.2, oy);
      shctx.fill();
    }
    shctx.globalAlpha = 1;
  }
}

// ---- the hero: a turtle in three-quarter view from above ---------------------------------------
// Carapace built from real scute plates (vertebral row, costal plates, marginal ring), lit by the
// sun key from upper left, with the floor's caustic pattern crawling over it and a darker flank.
const causticTex = document.createElement('canvas'); causticTex.width = 96; causticTex.height = 96;
const ctTex = causticTex.getContext('2d'), ctData = ctTex.createImageData(96, 96);
function renderShellCaustics(t) {
  for (let y = 0; y < 96; y++) for (let x = 0; x < 96; x++) {
    const c = caustic(x / 96 * 7, y / 96 * 7, t * 0.8);
    const o = (y * 96 + x) * 4;
    ctData.data[o] = 255; ctData.data[o + 1] = 244; ctData.data[o + 2] = 214; ctData.data[o + 3] = Math.round(clamp(c * 1.6, 0, 1) * 255);
  }
  ctTex.putImageData(ctData, 0, 0);
}
// Scute layout in shell space (x toward the head, shell radii 1 x 0.78).
const VERT = [-0.62, -0.31, 0, 0.31, 0.6].map((x, i) => ({ x, w: 0.17, h: 0.19 - Math.abs(i - 2) * 0.012,
  j: Array.from({ length: 6 }, () => [(rand() - 0.5) * 0.05, (rand() - 0.5) * 0.05]), tone: 0.85 + rand() * 0.3 }));
const COSTAL = [-0.52, -0.16, 0.2, 0.52];
const MOTTLE = Array.from({ length: 40 }, () => [0.08 + rand() * 0.88, (rand() - 0.5) * 1.6, 0.025 + rand() * 0.06, 0.08 + rand() * 0.14]);
function turtleAt(t) {
  const k = move(t, 0.4, 3.4), k2 = move(t, 3.4, 6);
  return {
    x: lerp(lerp(0.64, 0.42, k), 0.46, k2) * 1920,
    y: lerp(lerp(0.4, 0.52, k), 0.5, k2) * 1080,
    s: lerp(lerp(0.04, 0.22, k), 0.26, k2) * 1080,
    rot: lerp(-0.18, -0.06, k) + Math.sin(t * 1.1) * 0.025,
    depth: lerp(lerp(16, 7.5, k), 6.5, k2),
  };
}
function drawTurtle(ctx, t, cam, P, T) {
  const flap = Math.sin(t * 2.2) * 0.32;
  const ao = D.ambientOcclusion, ex = D.exposure;
  const rgb = (r, g, b, a = 1) => `rgba(${Math.round(clamp(r, 0, 255))},${Math.round(clamp(g, 0, 255))},${Math.round(clamp(b, 0, 255))},${a})`;
  ctx.save();
  ctx.translate(T.x, T.y); ctx.rotate(T.rot); ctx.scale(T.s, T.s * 0.86);   // three-quarter: a little foreshortened
  // Flippers under the shell: mottled skin, darker toward the body, warm light through the thin trailing edge.
  const flipper = (x, y, len, wid, ang, side) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, -wid * 0.45);
    ctx.bezierCurveTo(len * 0.35, -wid * 0.95 * side, len * 0.85, -wid * 0.35 * side, len, wid * 0.12 * side);
    ctx.bezierCurveTo(len * 0.72, wid * 0.5, len * 0.32, wid * 0.62, 0, wid * 0.45);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, rgb(30 * ex, 38 * ex, 40 * ex));
    g.addColorStop(0.5, rgb(70 * ex, 78 * ex, 72 * ex));
    g.addColorStop(1, rgb(88 * ex, 94 * ex, 82 * ex));
    ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip();
    // Mottled skin: irregular pale blotches over darker skin, denser toward the body.
    for (const [u, v, r, a] of MOTTLE) {
      ctx.fillStyle = `rgba(150,156,128,${a})`;
      ctx.beginPath(); ctx.ellipse(len * u, wid * v * 0.5, wid * r, wid * r * 0.7, u * 3, 0, 6.28); ctx.fill();
    }
    // Light passing through the thin trailing edge (subsurface stand-in).
    if (D.sss > 0) {
      const e = ctx.createLinearGradient(0, wid * 0.15, 0, wid * 0.6);
      e.addColorStop(0, 'rgba(255,170,90,0)'); e.addColorStop(1, `rgba(255,${Math.round(165 + 25 * D.warmth)},95,${0.55 * D.sss})`);
      ctx.fillStyle = e; ctx.fillRect(0, -wid, len, wid * 2);
    }
    ctx.restore();
    ctx.restore();
  };
  flipper(0.42, -0.6, 1.3, 0.38, -0.95 + flap, 1);
  flipper(0.42, 0.6, 1.3, 0.38, 0.95 - flap, -1);
  flipper(-0.66, -0.42, 0.52, 0.22, -2.45 - flap * 0.4, -1);
  flipper(-0.66, 0.42, 0.52, 0.22, 2.45 + flap * 0.4, 1);
  // Head and neck: wedge, scaled, darker underneath.
  ctx.save(); ctx.translate(1.0, 0.02);
  ctx.beginPath(); ctx.moveTo(-0.08, -0.17); ctx.quadraticCurveTo(0.32, -0.2, 0.42, 0); ctx.quadraticCurveTo(0.32, 0.2, -0.08, 0.17); ctx.closePath();
  const hg = ctx.createLinearGradient(0, -0.2, 0, 0.2);
  hg.addColorStop(0, rgb(104 * ex, 106 * ex, 88 * ex)); hg.addColorStop(1, rgb(32, 40, 42));
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = rgb(30, 28, 22, 0.6); ctx.lineWidth = 0.012;
  for (const [x, y, r] of [[0.08, -0.06, 0.06], [0.2, -0.05, 0.05], [0.14, 0.05, 0.06], [0.28, 0.02, 0.04]]) { ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.8, 0, 0, 6.28); ctx.stroke(); }
  ctx.fillStyle = rgb(10, 10, 12); ctx.beginPath(); ctx.ellipse(0.27, -0.1, 0.025, 0.018, 0, 0, 6.28); ctx.fill();
  ctx.restore();
  // Flank / plastron edge: the shell's thickness, in shadow (key:fill about 4:1).
  ctx.beginPath(); ctx.ellipse(0.02, 0.1, 1.0, 0.76, 0, 0, 6.28);
  ctx.fillStyle = rgb(46 * (1 - ao * 0.5), 38 * (1 - ao * 0.5), 30 * (1 - ao * 0.5)); ctx.fill();
  // Carapace.
  ctx.beginPath(); ctx.ellipse(0, 0, 1.0, 0.78, 0, 0, 6.28);
  const sg = ctx.createRadialGradient(-0.35, -0.38, 0.05, -0.05, 0, 1.15);
  sg.addColorStop(0, rgb(212 * ex * P.sun[0], 148 * ex, 76 * ex * P.sun[2]));
  sg.addColorStop(0.45, rgb(156 * ex, 104 * ex, 56 * ex));
  sg.addColorStop(0.8, rgb(70, 48, 30));
  sg.addColorStop(1, rgb(34 * (1 - ao * 0.6), 26 * (1 - ao * 0.6), 22 * (1 - ao * 0.6)));
  ctx.fillStyle = sg; ctx.fill();
  ctx.save(); ctx.clip();
  const seam = rgb(34, 22, 12, 0.35 + 0.55 * D.shellDetail), lift = (x, y, r) => {
    const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.3, 0, x, y, r);
    g.addColorStop(0, `rgba(236,186,118,${0.32 * D.shellDetail})`); g.addColorStop(1, 'rgba(236,186,118,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  };
  // Plate centres lift toward the light.
  for (const v of VERT) lift(v.x, 0, 0.17);
  for (const x of COSTAL) { lift(x, -0.45, 0.17); lift(x, 0.45, 0.17); }
  ctx.strokeStyle = seam; ctx.lineWidth = 0.02; ctx.lineJoin = 'round';
  // Vertebral row: hexagonal plates along the midline.
  for (const v of VERT) {
    const pts = [[-v.w, 0], [-v.w * 0.55, -v.h], [v.w * 0.55, -v.h], [v.w, 0], [v.w * 0.55, v.h], [-v.w * 0.55, v.h]].map(([px, py], i) => [v.x + px + v.j[i][0], py + v.j[i][1]]);
    ctx.beginPath(); pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py))); ctx.closePath();
    ctx.fillStyle = v.tone > 1 ? `rgba(240,200,140,${(v.tone - 1) * 0.5})` : `rgba(40,24,10,${(1 - v.tone) * 0.6})`; ctx.fill();
    ctx.stroke();
  }
  // Costal seams: from the vertebral row out to the marginal ring.
  for (const sgn of [-1, 1]) {
    for (let i = 0; i < 5; i++) {
      const x0 = [-0.7, -0.38, -0.06, 0.26, 0.58][i] + 0.08;
      ctx.beginPath(); ctx.moveTo(x0, sgn * 0.19); ctx.lineTo(x0 * 1.15 + (i - 2) * 0.05, sgn * 0.66); ctx.stroke();
    }
  }
  // Marginal ring and its small plates.
  ctx.beginPath(); ctx.ellipse(0, 0, 0.86, 0.66, 0, 0, 6.28); ctx.stroke();
  ctx.lineWidth = 0.018;
  for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 0.86, Math.sin(a) * 0.66); ctx.lineTo(Math.cos(a) * 1.0, Math.sin(a) * 0.78); ctx.stroke(); }
  // Fine growth lines inside each plate.
  ctx.strokeStyle = 'rgba(40,26,14,0.18)'; ctx.lineWidth = 0.008;
  for (const v of VERT) for (const r of [0.07, 0.12]) { ctx.beginPath(); ctx.ellipse(v.x, 0, r, r * 1.05, 0, 0, 6.28); ctx.stroke(); }
  // Caustics crawling over the shell, the same pattern as the floor, softer.
  if (D.causticOnSubject > 0) {
    renderShellCaustics(t * D.causticSpeed);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = clamp(D.causticOnSubject, 0, 1) * 0.7;
    ctx.drawImage(causticTex, -1.1, -0.9, 2.2, 1.8);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // Shadow side: cool ambient fill on the lower right.
  const sh = ctx.createLinearGradient(-0.6, -0.6, 0.8, 0.8);
  sh.addColorStop(0.35, 'rgba(6,24,48,0)'); sh.addColorStop(1, `rgba(6,24,48,${0.5 + 0.4 * ao})`);
  ctx.fillStyle = sh; ctx.fillRect(-1.1, -0.9, 2.2, 1.8);
  ctx.restore();
  // Narrow specular rim where the key grazes the carapace (upper left).
  ctx.beginPath(); ctx.ellipse(0, 0, 0.985, 0.765, 0, 3.55, 4.75);
  ctx.lineWidth = 0.02; ctx.strokeStyle = `rgba(214,240,255,${0.7 * ex})`; ctx.stroke();
  ctx.restore();
}

// ---- marine snow -------------------------------------------------------------------------------
const flakes = Array.from({ length: 1800 }, () => ({ x: rand(), y: rand(), z: 0.6 + Math.pow(rand(), 1.7) * 18, r: 0.5 + rand(), ph: rand() * 6.28 }));
// A handful of flakes drifting right in front of the lens: large soft discs, read as bokeh.
const lensFlakes = [[0.16, 0.78, 0.26], [0.08, 0.3, 0.45], [0.84, 0.86, 0.34], [0.44, 0.14, 0.62], [0.72, 0.6, 0.52], [0.3, 0.52, 0.8]].map(([x, y, z], i) => ({ x, y, z, r: 1.2, ph: i * 1.7 }));
function drawLensFlakes(ctx, t, cam, P) {
  for (const f of lensFlakes) {
    const x = (f.x + Math.sin(t * 0.3 + f.ph) * 0.01) * 1920, y = (f.y + t * 0.006 * D.snowDrift) * 1080;
    const coc = Math.abs(1 / f.z - 1 / cam.focus) * 70 * D.aperture;
    const lit = 0.35 + 0.65 * cam.rack;
    const a = clamp(0.4 * lit, 0, 0.6) * clamp(cam.rack * 1.4, 0.15, 1);
    const col = P.sun.map((v, k) => Math.round(clamp(v * 0.45 + P.water[k] * 0.9, 0, 1) * 255)).join(',');
    const g = ctx.createRadialGradient(x, y, coc * 0.1, x, y, coc);
    g.addColorStop(0, `rgba(${col},${a * 0.75})`); g.addColorStop(0.7, `rgba(${col},${a * 0.6})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, coc, 0, 6.28); ctx.fill();
  }
}
function shaftLightAt(x, y, t, cam) {
  // Brightness of the shaft field at a screen point (same geometry as drawShafts).
  const ox = 0.24 * 1920, oy = 1080 * lerp(-0.25, -1.1, cam.tilt);
  const ang = Math.atan2(x - ox, y - oy);
  let best = 0;
  const n = Math.round(clamp(D.rayCount, 0, 16));
  for (let i = 0; i < n; i++) {
    const s = shafts[i];
    const a = 0.38 + s.off * D.raySpread * 0.55 + Math.sin(t * 0.35 + s.ph) * 0.025;
    best = Math.max(best, Math.exp(-((ang - a) ** 2) / (2 * (0.012 + s.w * 0.012) ** 2)) * s.a);
  }
  return best;
}
function drawSnow(ctx, t, cam, P, near) {
  const count = Math.round(clamp(D.snowDensity, 0, 3) * 600);
  for (let i = 0; i < Math.min(count, flakes.length); i++) {
    const f = flakes[i];
    if ((f.z < 2.2) !== near) continue;
    // Sinking + slow swirl, wrapped; parallax: nearer flakes move more with the camera.
    const drift = t * D.snowDrift;
    let x = (f.x + Math.sin(drift * 0.4 + f.ph) * 0.01 + drift * 0.004 / f.z * 4) % 1;
    let y = (f.y + drift * 0.012 + cam.tilt * 0.9 / f.z) % 1;
    if (x < 0) x += 1;
    const zx = 960 + (x * 1920 - 960) * (1 + (cam.zoom - 1) * 3 / f.z), zy = 540 + (y * 1080 - 540) * (1 + (cam.zoom - 1) * 3 / f.z);
    const size = f.r * 2.2 * D.snowSize * (4 / f.z + 0.6);
    const coc = Math.abs(1 / f.z - 1 / cam.focus) * 38 * D.aperture;
    const rad = Math.max(0.7, Math.hypot(size, coc));
    const lit = lerp(1, 0.25 + 1.6 * shaftLightAt(zx, zy, t, cam), D.snowLightFollow);
    const a = clamp(1.05 * lit * size * size / (rad * rad) * Math.exp(-f.z * 0.09 * D.depthFalloff), 0, 0.95);
    if (a < 0.01) continue;
    const col = P.sun.map((v, k) => Math.round(clamp(v * 0.8 + P.water[k] * 0.3, 0, 1) * 255)).join(',');
    const g = ctx.createRadialGradient(zx, zy, 0, zx, zy, rad);
    if (coc > size * 1.5) { g.addColorStop(0, `rgba(${col},${a * 0.6})`); g.addColorStop(0.75, `rgba(${col},${a * 0.5})`); g.addColorStop(1, `rgba(${col},0)`); }
    else { g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(zx, zy, rad, 0, 6.28); ctx.fill();
  }
}

// ---- grain tiles (seeded) ----------------------------------------------------------------------
const GT = 192, grainTiles = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement('canvas'); c.width = GT; c.height = GT;
  const g = c.getContext('2d'), id = g.createImageData(GT, GT);
  for (let i = 0; i < GT * GT; i++) { const v = Math.round(128 + (rand() - 0.5) * 90); id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0);
  grainTiles.push(c);
}

// ---- layers + compositing ---------------------------------------------------------------------
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const bgx = bg.getContext('2d');
const mid = document.createElement('canvas'); mid.width = W; mid.height = H;
const midx = mid.getContext('2d');

M.setup({
  width: W, height: H, fps: 30, duration: DUR, background: '#02121e',
  draw(ctx, t) {
    const cam = camera(t), P = palette();
    // Background: surfaces + shafts, defocused when focus racks to the lens.
    renderSurfaces(t, cam, P);
    drawShafts(t, cam, P);
    const bgBlur = Math.abs(1 / 12 - 1 / cam.focus) * 9 * D.aperture * S;
    bgx.setTransform(1, 0, 0, 1, 0, 0);
    bgx.filter = bgBlur > 0.4 ? `blur(${bgBlur.toFixed(2)}px)` : 'none';
    bgx.imageSmoothingEnabled = true;
    bgx.drawImage(surf, -W * 0.02, -H * 0.02, W * 1.04, H * 1.04);
    bgx.globalCompositeOperation = 'screen';
    bgx.filter = `blur(${(D.raySoftness * S * 0.5 + bgBlur).toFixed(2)}px)`;
    bgx.drawImage(shaftLayer, 0, 0, W, H);
    bgx.globalCompositeOperation = 'source-over';
    bgx.filter = 'none';

    // Mid layer: far snow, the turtle's shadow and the turtle, defocused by its own depth.
    midx.setTransform(1, 0, 0, 1, 0, 0);
    midx.clearRect(0, 0, W, H);
    midx.setTransform(S, 0, 0, S, 0, 0);
    const T = turtleAt(t);
    if (cam.tilt > 0.3) {
      midx.save();
      const off = T.s * 0.55 * cam.tilt;
      const g = midx.createRadialGradient(T.x + off * 0.4, T.y + off, 0, T.x + off * 0.4, T.y + off, T.s * 1.4);
      g.addColorStop(0, `rgba(0,10,20,${0.45 * cam.tilt * D.ambientOcclusion + 0.1})`); g.addColorStop(1, 'rgba(0,10,20,0)');
      midx.fillStyle = g; midx.beginPath(); midx.ellipse(T.x + off * 0.4, T.y + off, T.s * 1.4, T.s * 0.9, 0, 0, 6.28); midx.fill();
      midx.restore();
    }
    drawTurtle(midx, t, cam, P, T);
    const hz = 1 - Math.exp(-T.depth * 0.07 * D.depthFalloff);
    midx.save(); midx.setTransform(1, 0, 0, 1, 0, 0); midx.globalCompositeOperation = 'source-atop';
    midx.fillStyle = `rgba(${P.deep.map((v) => Math.round(clamp(v * 1.6, 0, 1) * 255)).join(',')},${(hz * 0.85).toFixed(3)})`;
    midx.fillRect(0, 0, W, H);
    // Mid-water, seen from below against the bright surface: the turtle reads as a dark silhouette
    // with a thin cool rim, matching the upward view of the establishing beat.
    const below = 1 - smooth((cam.tilt - 0.15) / 0.45);
    if (below > 0) { midx.fillStyle = `rgba(4,16,30,${(0.85 * below).toFixed(3)})`; midx.fillRect(0, 0, W, H); }
    midx.restore();
    if (below > 0) {
      midx.save(); midx.translate(T.x, T.y); midx.rotate(T.rot); midx.scale(T.s, T.s * 0.86);
      midx.beginPath(); midx.ellipse(0, 0, 1.0, 0.78, 0, 3.4, 5.6);
      midx.lineWidth = 0.05; midx.strokeStyle = `rgba(190,232,255,${(0.6 * below).toFixed(3)})`; midx.stroke(); midx.restore();
    }
    drawSnow(midx, t, cam, P, false);
    const turtleBlur = Math.abs(1 / T.depth - 1 / cam.focus) * 16 * D.aperture * S;

    // Compose under the camera transform (push-in + shake).
    ctx.save();
    ctx.translate(W / 2 + cam.sx * S, H / 2 + cam.sy * S);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(bg, 0, 0);
    ctx.filter = turtleBlur > 0.4 ? `blur(${turtleBlur.toFixed(2)}px)` : 'none';
    ctx.drawImage(mid, 0, 0);
    ctx.filter = 'none';
    ctx.restore();
    // Near snow (in front of the lens), drawn last and not zoomed.
    ctx.save(); ctx.scale(S, S);
    drawSnow(ctx, t, cam, P, true);
    drawLensFlakes(ctx, t, cam, P);
    ctx.restore();

    // Grade: exposure, vignette, grain.
    if (D.exposure !== 1) { ctx.globalCompositeOperation = D.exposure > 1 ? 'screen' : 'multiply'; ctx.fillStyle = D.exposure > 1 ? `rgba(255,255,255,${clamp((D.exposure - 1) * 0.25, 0, 0.6)})` : `rgba(${Math.round(255 * D.exposure)},${Math.round(255 * D.exposure)},${Math.round(255 * D.exposure)},1)`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
    if (D.vignette > 0) {
      const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
      v.addColorStop(0, 'rgba(0,4,10,0)'); v.addColorStop(1, `rgba(0,4,10,${clamp(D.vignette, 0, 1)})`);
      ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    }
    if (D.grain > 0) {
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = clamp(D.grain, 0, 1) * 0.25;
      ctx.fillStyle = ctx.createPattern(grainTiles[Math.floor(t * 30) % grainTiles.length], 'repeat');
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  },
});
</script>
</body>
</html>
