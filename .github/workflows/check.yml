# Re-renders the examples on every push and pull request, so a change that breaks rendering,
# sound or the self-check is caught before anyone uses it. The rendered videos and reports are
# attached to each run (Actions tab -> the run -> Artifacts).
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install opencv-python-headless numpy
      - run: npm test
      - name: Build the examples
        run: |
          node make.mjs scenes/examples/showcase.html --formats 4:5,16:9
          node make.mjs scenes/examples/ugc-ad.html --variants --fast
          node render.mjs scenes/examples/blocks-gallery.html --sheet
          node make.mjs scenes/examples/street-interview.html --fast
          node make.mjs scenes/examples/whiteboard-simulation.html
          node make.mjs scenes/examples/whiteboard-one-take.html
          node make.mjs scenes/examples/reel-effects.html
          node make.mjs scenes/examples/editorial-reel.html
          node make.mjs scenes/examples/character-wave-lab.html
          node make.mjs scenes/examples/character-light-lab.html
          if grep -qE "^- FIX" out/whiteboard-{simulation,one-take}.report.md out/reel-effects.report.md out/editorial-reel.report.md out/character-{wave,light}-lab.report.md; then exit 1; fi
      - name: Footage editor demo (no keys)
        run: npm run demo
      - name: Every template renders
        run: for f in scenes/templates/*.html; do node render.mjs "$f" --still 2 --out "out/templates/$(basename "$f" .html).mp4" || exit 1; done
      - name: Spreadsheet batch
        run: node batch-ads.mjs scenes/templates/three-reasons.html data/example-ads.csv --fast --batch ci-batch
      - name: Summary
        if: always()
        run: cat out/*.report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: |
            out/*.mp4
            out/*.png
            out/*.report.md
            out/demo/
          retention-days: 14

  simulation-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Browser preview and seeking
        run: CHROME_BIN="$(command -v google-chrome)" node tests/simulation-browser.mjs
      - name: Render and composite a Manim shot
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install manim==0.22.1
          manim render -ql --disable_caching --media_dir out/manim examples/manim/sine-trace.py SineTrace
          shot="$(find out/manim/videos -name SineTrace.mp4 -print -quit)"
          test -s "$shot"
          cp "$shot" out/manim/sine-trace.mp4
          node make.mjs examples/manim/sine-composite.html --fast
          grep -q 'PASS.*1 clip(s) found' out/sine-composite.report.md
      - uses: actions/upload-artifact@v4
        with:
          name: manim-composite
          path: out/sine-composite.mp4
