<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Refinement test scene</title>
<script src="../../kit/motion.js"></script>
</head>
<body>
<script>
// Small, fast scene for tests/refine.test.mjs: a lit gradient, a moving subject and seeded specks.
const D = M.data({ hue: 210, light: 0.5, speck: 1, flat: 0, shake: 0, flicker: 0, freezeFrom: -1, magenta: 0, resolutionScale: 1 });
const S = D.resolutionScale, W = Math.round(320 * S), H = Math.round(180 * S);
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(7), specks = Array.from({ length: 160 }, () => [R(), R(), 0.5 + R()]);
M.setup({
  width: W, height: H, fps: 12, duration: 2, background: '#000',
  draw(ctx, t) {
    if (D.freezeFrom >= 0 && t > D.freezeFrom) t = D.freezeFrom + Math.floor((t - D.freezeFrom) * 4) / 4;   // held frames
    ctx.scale(S, S);
    if (D.magenta) { ctx.fillStyle = '#ff00ff'; ctx.fillRect(0, 0, 320, 180); return; }
    if (D.flat) { ctx.fillStyle = '#336699'; ctx.fillRect(0, 0, 320, 180); return; }
    const sx = D.shake * Math.sin(t * 91) * 6, sy = D.shake * Math.cos(t * 77) * 6;
    ctx.translate(sx, sy);
    const g = ctx.createLinearGradient(0, 0, 0, 180);
    const l = D.light * (1 + D.flicker * (Math.floor(t * 12) % 2 ? 0.25 : -0.25));
    g.addColorStop(0, `hsl(${D.hue},70%,${Math.round(70 * l)}%)`);
    g.addColorStop(1, `hsl(${D.hue + 15},80%,${Math.round(12 * l)}%)`);
    ctx.fillStyle = g; ctx.fillRect(-10, -10, 340, 200);
    ctx.fillStyle = 'rgba(255,240,220,0.9)';
    for (const [x, y, r] of specks.slice(0, Math.round(160 * D.speck))) { ctx.beginPath(); ctx.arc(x * 320, (y * 180 + t * 12) % 180, r, 0, 6.28); ctx.fill(); }
    ctx.fillStyle = '#c08040';
    ctx.beginPath(); ctx.ellipse(80 + t * 60, 95, 34, 22, 0, 0, 6.28); ctx.fill();
  },
});
</script>
</body>
</html>
